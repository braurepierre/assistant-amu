    answerable: true
    regime: opener
    expected_source: "Calendriers universitaires"
    expected_keywords: []
  - id: h13
    question: "Peux-tu me parler de la charte que l'on signe au moment de l'inscription ?"
    answerable: true
    regime: opener
    expected_source: "Charte des étudiants"
    expected_keywords: []
  - id: h14
    question: "Dis-moi combien coûtent les droits d'inscription."
    answerable: true
    regime: opener
    expected_source: "Droits d'inscription"
    expected_keywords: []

  # --- Regime B: conversational phrasings `strip` does NOT touch -------------
  - id: h15
    question: "Je n'arrive pas à décoder les abréviations employées à l'ALLSH."
    answerable: true
    regime: indirect
    expected_source: "Sigles"
    expected_keywords: []
  - id: h16
