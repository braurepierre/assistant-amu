    expected_source: "Régimes spéciaux"           # "Droit — Régimes spéciaux d'études"
    expected_keywords: []
  - id: h17
    question: "Je suis en licence et j'envisage une pause d'un an avant de reprendre. Comment ça se passe ?"
    answerable: true
    regime: personal
    expected_source: "césure"
    expected_keywords: []
  - id: h18
