# Read the Docs — construction du site de documentation.
#
# Pelican n'est ni Sphinx ni MkDocs : la construction passe par `build.commands`,
# qui remplace entièrement les étapes prédéfinies de Read the Docs. Le site doit
# donc être écrit dans $READTHEDOCS_OUTPUT/html.
#
# Aucune dépendance du projet n'est installée ici : la référence d'API est
# extraite du source par analyse statique (docs/site/apiref.py).

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  commands:
    - pip install -r docs/site/requirements.txt
    - python docs/site/build_site.py --output $READTHEDOCS_OUTPUT/html
