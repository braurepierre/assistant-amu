# corpus/sources.yaml — versioned list of source documents (PRD §7.1).
#
# Each entry under `documents:`:
#   - title:    human-readable document title            (required)
#     category: reglement-scolarite | guide-etudiant | composante   (required)
#     type:     pdf | html                                (required)
#     url:      "https://www.univ-amu.fr/..."             (or `path:` for a local file)
#     extractor: docling                                  (optional — PDF escalation, §7.2)
#
# NOTE: AMU's official site is https://www.univ-amu.fr (NOT amu.fr, which is an
# unrelated company). Documents collected 2026-07-22 by browsing univ-amu.fr and
# its faculty subdomains. Many faculty documents (règlement/MCC) live behind the
# ENT/intranet; the public corpus therefore leans on central documents + the
# faculties that publish openly (ALLSH, Droit). Run
# `python -m assistant_amu.ingestion.download` to fetch; dead links are logged,
# not fatal (F1).

documents:
