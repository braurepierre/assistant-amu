[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "assistant-amu"
version = "0.1.0"
description = "RAG documentary assistant over Aix-Marseille Université public documents."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
# Dependencies mirror PRD §6.1. Additions outside that list are justified in
# JOURNAL.md (PRD §11.7): `pyyaml` (sources.yaml / eval YAML), `python-multipart`
# (FastAPI multipart POST /ingest).
dependencies = [
    "sentence-transformers",
    "chromadb",
    "rank-bm25",
    "pdfplumber",
    "beautifulsoup4",
    "fastapi",
    "uvicorn[standard]",
    "pydantic>=2",
    "httpx",
    "python-dotenv",
    "pyyaml",
    "python-multipart",
]

[project.optional-dependencies]
# Installed on demand — see PRD §6.1 / §7.2.
# fpdf2 is test-only: generates tiny PDF fixtures for ingestion tests (JOURNAL §11.7).
dev = ["pytest", "fpdf2"]
docling = ["docling"]  # PDF layout/table escalation (PRD §7.2)
# Demo UI (§5.4 bonus) = demo.html, a dependency-free vanilla page served by the
# API at "/". No extra needed.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    # Benign: starlette's TestClient warns about httpx; not our code.
    "ignore:Using `httpx` with `starlette.testclient`",
]
